<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Sri Murugan Silks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sri Murugan Silks</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#products">Products</a></li>
            <li><a href="cart.html" id="cart-link">Cart (0)</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="admin.html" class="admin-link">Admin ⚙️</a></li>
        </ul>
    </nav>
    <main class="cart-section">
        <h2>Your Shopping Cart</h2>
        <div class="cart-container">
            <div id="cart-items" class="cart-items">
                <!-- Items populated here -->
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <p>Total Items: <span id="total-count">0</span></p>
                <p>Total Price: ₹<span id="total-price">0</span></p>
                <button class="btn" id="checkout-btn" onclick="checkout()">Checkout 🛍️</button>
                <button class="btn btn-outline" onclick="clearCart()">Clear Cart ❌</button>
            </div>
        </div>
    </main>
    <footer id="contact">
        <p>&copy; 2026 Sri Murugan Silks. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
